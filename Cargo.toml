# The Tauri app's crate lives in src-tauri/, where Tauri expects it; this workspace puts its
# Cargo.lock and target/ at the root, where the rust and release suites build.
[workspace]
members = ["src-tauri"]
resolver = "2"

# The release serves the embedded frontend, as `tauri build` would.
[workspace.metadata.pipeline-templates.targets.x86_64-pc-windows-msvc]
features = ["custom-protocol"]
