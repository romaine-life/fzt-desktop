[package]
name = "fzt-desktop"
version = "0.1.0"
description = "Native Windows desktop surface for fzt-automate + ambience pixel art"
authors = ["nelsong6"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# Only the Windows executable ships: no cdylib or staticlib, which only Tauri's mobile builds use.
name = "fzt_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The release build: the frontend served from the embedded src/ through Tauri's custom
# protocol. `tauri build` turns it on itself; a plain `cargo build` needs it named.
custom-protocol = ["tauri/custom-protocol"]
